server:
  port: 0

spring:
  application:
    name: main-service

  sql:
    init:
      mode: never

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:6542/ewm-db
    username: stat
    password: stat
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.boot.sql.init: DEBUG
    org.springframework.jdbc.datasource.init.ScriptUtils: DEBUG