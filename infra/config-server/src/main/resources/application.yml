server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native  # активируем использование локальных файлов, а не Git

  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/config/{application}

eureka:
  client:
    service-url:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/