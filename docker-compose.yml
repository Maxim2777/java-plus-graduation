services:

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_USER=stat
      - POSTGRES_PASSWORD=stat
      - POSTGRES_DB=ewm-db
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "stat", "-d", "ewm-db" ]
      timeout: 5s
      interval: 5s
      retries: 10