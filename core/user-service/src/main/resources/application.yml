server:
  port: 0

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://user-db:6542/ewm-db
    username: stat
    password: stat
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true
