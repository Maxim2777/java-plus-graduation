syntax = "proto3";

package stats.service.analyzer;

import "messages/recommendation.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.analyzer";
option java_outer_classname = "RecommendationServiceProto";

// gRPC-сервис для получения рекомендаций
service RecommendationService {

  // Получить персональные рекомендации для пользователя
  rpc GetRecommendations(stats.message.recommendation.RecommendationRequest)
      returns (stats.message.recommendation.RecommendationResponse);
}