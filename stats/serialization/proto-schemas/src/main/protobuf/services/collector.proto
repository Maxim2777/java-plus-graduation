syntax = "proto3";

package stats.service.collector;

import "google/protobuf/empty.proto";
import "messages/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.collector";
option java_outer_classname = "UserActionCollectorProto";

// gRPC-сервис для сбора действий пользователей
service UserActionController {
  rpc CollectUserAction (stats.message.user.UserActionProto)
      returns (google.protobuf.Empty);
}