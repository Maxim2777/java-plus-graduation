spring:
  application:
    name: analyzer

  datasource:
    url: jdbc:postgresql://stats-db:5432/stats-db
    username: stat
    password: stat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka